name: TSUS PP2 Admissions Watch

on:
  schedule:
    # Runs hourly. GitHub scheduled runs can be delayed during busy periods.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsus-pp2-admissions-watch
  cancel-in-progress: false

jobs:
  check-admissions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check TSUS admissions and send alert if ready
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STATE_FILE: tsus_pp2_alert_sent.txt
        run: python tsus_pp2_watch.py

      - name: Save alert-sent state
        if: always()
        run: |
          if [[ -f tsus_pp2_alert_sent.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tsus_pp2_alert_sent.txt
            git diff --cached --quiet || git commit -m "Record TSUS PP2 alert state"
            git push
          fi
